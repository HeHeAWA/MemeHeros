modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"
showAsResourcePack=false

[[mods]]
modId="memeheroes"
version="${file.jarVersion}"
displayName="Meme Heroes"
authors="lqlovehehe"
description="""
梗明星大乱斗 - 将网络热梗转化为技能！
"""

[[dependencies.memeheroes]]
modId="forge"
mandatory=true
versionRange="[47.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.memeheroes]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

# PolyMesh（glTF 渲染库）：可选依赖。
# - 装了 Polymesh：可用 PolyMeshModels 把 gltf 模型绑定到物品/实体/方块实体
# - 没装 Polymesh：本 mod 仍能独立运行（5 个梗职业正常工作），但 gltf 模型无法渲染
[[dependencies.memeheroes]]
modId="polymesh"
mandatory=false
versionRange="[1.0.0,)"
ordering="NONE"
side="CLIENT"

[[mixins]]
package="com.example.memeheroes.mixin"
config="memeheroes.mixins.json"
