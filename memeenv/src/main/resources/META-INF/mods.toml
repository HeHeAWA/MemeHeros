# 环境 MOD 必须安装本体 MOD 才能工作：梗技能物品与 MemeBridge 注册中心由 memeheroes 提供
[[dependencies.memeenv]]
    modId="memeheroes"
    mandatory=true
    versionRange="[1.0.1,)"
    ordering="BEFORE"
    side="BOTH"
